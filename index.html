<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOOGON YOO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: #888888;
      --border: #eaeaea;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      overflow-x: hidden;
    }

    /* Fixed Minimal Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 36px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.3s ease;
    }

    header.on-cover {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .brand {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--fg);
      text-decoration: none;
      cursor: pointer;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-btn {
      background: none;
      border: none;
      font-family: var(--font);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .nav-btn:hover,
    .nav-btn.active {
      color: var(--fg);
    }

    /* Fullscreen Single-Image Cover */
    #cover {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 84px 36px 68px;
      background: var(--bg);
    }

    .cover-stage {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 1200px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }

    .cover-slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .cover-slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    .cover-slide img,
    .cover-slide video {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .cover-replace {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid var(--border);
      color: var(--fg);
      font-size: 10px;
      letter-spacing: 0.1em;
      padding: 6px 10px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .cover-stage:hover .cover-replace {
      opacity: 1;
    }

    .cover-footer {
      position: absolute;
      bottom: 24px;
      left: 36px;
      right: 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cover-dots {
      display: flex;
      gap: 9px;
      align-items: center;
      flex-wrap: wrap;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #d4d4d4;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .dot.active {
      background: var(--fg);
      transform: scale(1.25);
    }

    .enter-btn {
      background: none;
      border: none;
      font-family: var(--font);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--fg);
      cursor: pointer;
      padding: 4px 0;
    }

    /* Editorial Asymmetric Portfolio Grid */
    #work {
      max-width: 1440px;
      margin: 0 auto;
      padding: 120px 36px 140px;
    }

    .editorial-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      column-gap: 32px;
      row-gap: 110px;
      align-items: start;
    }

    .work-item {
      position: relative;
      cursor: pointer;
    }

    /* Repeating 6-item editorial rhythm */
    .work-item:nth-child(6n + 1) { grid-column: 1 / 8; }
    .work-item:nth-child(6n + 2) { grid-column: 9 / 13; margin-top: 90px; }
    .work-item:nth-child(6n + 3) { grid-column: 2 / 6; }
    .work-item:nth-child(6n + 4) { grid-column: 7 / 13; margin-top: 60px; }
    .work-item:nth-child(6n + 5) { grid-column: 1 / 6; margin-top: 40px; }
    .work-item:nth-child(6n + 6) { grid-column: 7 / 12; }

    .frame-wrap {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #f5f5f5;
      min-height: 220px;
    }

    .frame-wrap img,
    .frame-wrap video {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .work-item:hover .frame-wrap img,
    .work-item:hover .frame-wrap video {
      transform: scale(1.015);
    }

    .empty-slot {
      width: 100%;
      aspect-ratio: 4 / 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px dashed #cccccc;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: #fafafa;
    }

    .slot-actions {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 5;
    }

    .work-item:hover .slot-actions {
      opacity: 1;
    }

    .action-tag {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border);
      color: var(--fg);
      font-size: 10px;
      letter-spacing: 0.08em;
      padding: 5px 8px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .action-tag:hover {
      background: var(--fg);
      color: var(--bg);
    }

    .caption {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg);
    }

    .caption-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .insert-inline {
      background: none;
      border: none;
      font-family: var(--font);
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--muted);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s ease, color 0.2s ease;
      text-transform: uppercase;
    }

    .work-item:hover .insert-inline {
      opacity: 1;
    }

    .insert-inline:hover {
      color: var(--fg);
    }

    .caption span.num {
      color: var(--muted);
      font-size: 10px;
    }

    /* Archive List View */
    #archive-view {
      display: none;
      max-width: 1440px;
      margin: 0 auto;
      padding: 130px 36px 140px;
    }

    .archive-row {
      display: grid;
      grid-template-columns: 80px 1fr 140px;
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .archive-row:hover {
      opacity: 0.5;
    }

    /* Info Modal */
    #info-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(255, 255, 255, 0.98);
      padding: 24px 36px;
      flex-direction: column;
      justify-content: space-between;
    }

    #info-modal.open {
      display: flex;
    }

    .info-body {
      max-width: 480px;
      margin: auto 0;
      display: flex;
      flex-direction: column;
      gap: 24px;
      font-size: 12px;
      letter-spacing: 0.08em;
      line-height: 1.9;
      text-transform: uppercase;
    }

    .info-body a {
      color: var(--fg);
      text-decoration: none;
      border-bottom: 1px solid var(--fg);
      padding-bottom: 2px;
      width: fit-content;
    }

    /* Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(255, 255, 255, 0.98);
      padding: 24px 36px;
      flex-direction: column;
      justify-content: space-between;
    }

    #lightbox.open {
      display: flex;
    }

    .lb-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 24px 0;
    }

    .lb-main img,
    .lb-main video {
      max-height: 78vh;
      max-width: 88vw;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .lb-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    @media (max-width: 900px) {
      header { padding: 20px; }
      #cover { padding: 76px 20px 64px; }
      .cover-footer { left: 20px; right: 20px; bottom: 20px; }
      #work { padding: 90px 20px 100px; }
      .editorial-grid {
        grid-template-columns: 1fr;
        row-gap: 64px;
      }
      .work-item:nth-child(n) {
        grid-column: 1 / -1;
        margin-top: 0;
      }
      nav { gap: 14px; }
    }
  </style>
</head>
<body>

  <header id="site-header" class="on-cover">
    <a class="brand" onclick="goCover()">SOOGON YOO</a>
    <nav>
      <button class="nav-btn active" id="btn-all" onclick="showAll()">ALL</button>
      <button class="nav-btn" id="btn-archive" onclick="showArchive()">ARCHIVE</button>
      <button class="nav-btn" onclick="addNewSlot(projects.length)">+ ADD SLOT</button>
      <button class="nav-btn" onclick="triggerBulkUpload()">+ UPLOAD</button>
      <button class="nav-btn" onclick="toggleInfo(true)">INFO</button>
    </nav>
  </header>

  <!-- Fullscreen Single-Media Cover -->
  <section id="cover">
    <div class="cover-stage" id="cover-stage" onclick="enterWork()">
      <button class="cover-replace" onclick="event.stopPropagation(); replaceSingle(currentSlide)">REPLACE</button>
    </div>
    <div class="cover-footer">
      <div class="cover-dots" id="cover-dots"></div>
      <button class="enter-btn" onclick="enterWork()">ENTER &darr;</button>
    </div>
  </section>

  <!-- Asymmetric Editorial Grid -->
  <main id="work">
    <div class="editorial-grid" id="editorial-grid"></div>
  </main>

  <!-- Archive Index -->
  <section id="archive-view"></section>

  <!-- Minimal Info Overlay -->
  <div id="info-modal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span class="brand">SOOGON YOO</span>
      <button class="nav-btn" style="color:var(--fg);" onclick="toggleInfo(false)">CLOSE</button>
    </div>
    <div class="info-body">
      <div>SEOUL, REPUBLIC OF KOREA</div>
      <a href="mailto:sgy@bordistudio.com">SGY@BORDISTUDIO.COM</a>
      <a href="https://www.instagram.com/yoosugon/" target="_blank" rel="noopener">INSTAGRAM (@YOOSUGON)</a>
    </div>
    <div style="font-size:10px; letter-spacing:0.12em; color:var(--muted);">
      &copy; 2026 SOOGON YOO
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span id="lb-title" style="font-size:11px; letter-spacing:0.12em; text-transform:uppercase;"></span>
      <div style="display:flex; gap:20px;">
        <button class="nav-btn" style="color:var(--fg);" onclick="replaceSingle(activeIndex)">REPLACE</button>
        <button class="nav-btn" style="color:var(--fg);" onclick="closeLightbox()">CLOSE</button>
      </div>
    </div>
    <div class="lb-main" id="lb-main"></div>
    <div class="lb-footer">
      <button class="nav-btn" style="color:var(--fg);" onclick="stepLightbox(-1)">&larr; PREV</button>
      <span id="lb-counter" style="color:var(--muted);"></span>
      <button class="nav-btn" style="color:var(--fg);" onclick="stepLightbox(1)">NEXT &rarr;</button>
    </div>
  </div>

  <input type="file" id="single-input" accept="image/*,video/*" style="display:none;" />
  <input type="file" id="bulk-input" accept="image/*,video/*" multiple style="display:none;" />

  <script>
    const defaultProjects = [
      { title: 'KITARA CAMPAIGN I', year: '2026', img: 'yoosugon-post-DcTWj2sFAR--01.jpg' },
      { title: 'KITARA CAMPAIGN II', year: '2026', img: 'yoosugon-post-DcTWj2sFAR--06.jpg' },
      { title: 'KITARA CAMPAIGN III', year: '2026', img: 'yoosugon-post-DcTWj2sFAR--09.jpg' },
      { title: 'KITARA CAMPAIGN IV', year: '2026', img: 'yoosugon-post-DcTWj2sFAR--12.jpg' },
      { title: 'KITARA CAMPAIGN V', year: '2026', img: 'yoosugon-post-DcTWj2sFAR--16.jpg' },
      { title: 'COLDE CONCEPT PHOTO', year: '2026', img: 'yoosugon-post-Dddein_zyHF.jpg' },
      { title: 'JENNIE BTS PHOTO I', year: '2026', img: 'yoosugon-post-DdQ3DBLlOnf-01.jpg' },
      { title: 'JENNIE BTS PHOTO II', year: '2026', img: 'yoosugon-post-DdQ3DBLlOnf-08.jpg' },
      { title: 'YUNE LOOKBOOK I', year: '2026', img: 'yoosugon-post-DeL_Ln8FETK-01.jpg' },
      { title: 'YUNE LOOKBOOK II', year: '2026', img: 'yoosugon-post-DeL_Ln8FETK-02.jpg' },
      { title: 'YUNE LOOKBOOK III', year: '2026', img: 'yoosugon-post-DeL_Ln8FETK-04.jpg' },
      { title: 'EDITORIAL FILM I', year: '2026', img: 'video_1.mp4', type: 'video' },
      { title: 'EDITORIAL V', year: '2026', img: 'yoosugon-post-Detv8mEFP9g-02.jpg' },
      { title: 'EDITORIAL VI', year: '2026', img: 'yoosugon-post-Detv8mEFP9g-04.jpg' },
      { title: 'EDITORIAL VII', year: '2026', img: 'yoosugon-post-DezC3bSFAkC-01.jpg' },
      { title: 'EDITORIAL VIII', year: '2026', img: 'yoosugon-post-DezC3bSFAkC-03.jpg' },
      { title: 'EDITORIAL IX', year: '2026', img: 'yoosugon-post-DezC3bSFAkC-04.jpg' }
    ];

    const STORAGE_KEY = 'soogonyoo_portfolio_v4';
    let projects = [];

    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      projects = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaultProjects));
    } catch (e) {
      projects = JSON.parse(JSON.stringify(defaultProjects));
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
      } catch (e) {}
    }

    function isVideoItem(p) {
      if (!p || !p.img) return false;
      if (p.type === 'video') return true;
      return /\.(mp4|mov|webm|m4v)(\?|$)/i.test(p.img) || p.img.startsWith('data:video/');
    }

    function createMediaElement(p, isLightbox = false) {
      if (isVideoItem(p)) {
        const video = document.createElement('video');
        video.src = p.img;
        video.autoplay = true;
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        if (isLightbox) video.controls = true;
        return video;
      }
      const img = document.createElement('img');
      img.src = p.img;
      img.alt = p.title;
      return img;
    }

    let currentSlide = 0;
    let activeIndex = 0;
    let replaceTargetIndex = 0;
    let slideTimer = null;

    function padNum(n) {
      return String(n).padStart(2, '0');
    }

    function renderCover() {
      const stage = document.getElementById('cover-stage');
      const dots = document.getElementById('cover-dots');
      const replaceBtn = stage.querySelector('.cover-replace');
      stage.innerHTML = '';
      stage.appendChild(replaceBtn);
      dots.innerHTML = '';

      const validSlides = projects.map((p, idx) => ({ ...p, originalIdx: idx })).filter(p => p.img);
      const list = validSlides.length ? validSlides : projects.map((p, idx) => ({ ...p, originalIdx: idx }));

      if (currentSlide >= list.length) currentSlide = 0;

      list.forEach((p, idx) => {
        const slide = document.createElement('div');
        slide.className = 'cover-slide' + (idx === currentSlide ? ' active' : '');
        if (p.img) {
          slide.appendChild(createMediaElement(p, false));
        } else {
          const empty = document.createElement('div');
          empty.className = 'empty-slot';
          empty.style.width = 'min(52vh, 80vw)';
          empty.textContent = '+ CLICK REPLACE TO UPLOAD';
          slide.appendChild(empty);
        }
        stage.appendChild(slide);

        const dot = document.createElement('button');
        dot.className = 'dot' + (idx === currentSlide ? ' active' : '');
        dot.onclick = (e) => {
          e.stopPropagation();
          setSlide(idx, list.length);
        };
        dots.appendChild(dot);
      });
    }

    function setSlide(idx, total) {
      const count = total || document.querySelectorAll('.cover-slide').length || 1;
      currentSlide = (idx + count) % count;
      document.querySelectorAll('.cover-slide').forEach((el, i) => {
        el.classList.toggle('active', i === currentSlide);
      });
      document.querySelectorAll('.dot').forEach((el, i) => {
        el.classList.toggle('active', i === currentSlide);
      });
      restartTimer();
    }

    function restartTimer() {
      if (slideTimer) clearInterval(slideTimer);
      slideTimer = setInterval(() => {
        setSlide(currentSlide + 1);
      }, 4500);
    }

    function renderGrid() {
      const grid = document.getElementById('editorial-grid');
      const archive = document.getElementById('archive-view');
      grid.innerHTML = '';
      archive.innerHTML = '';

      projects.forEach((p, idx) => {
        const numStr = padNum(idx + 1);
        const item = document.createElement('article');
        item.className = 'work-item';
        item.onclick = () => {
          if (p.img) {
            openLightbox(idx);
          } else {
            replaceSingle(idx);
          }
        };

        // Drag & drop support per item
        item.ondragover = (e) => { e.preventDefault(); };
        item.ondrop = (e) => {
          e.preventDefault();
          const file = e.dataTransfer.files[0];
          if (file && (file.type.startsWith('image/') || file.type.startsWith('video/'))) {
            loadMediaFile(file, idx);
          }
        };

        const frame = document.createElement('div');
        frame.className = 'frame-wrap';

        const actions = document.createElement('div');
        actions.className = 'slot-actions';

        const repBtn = document.createElement('button');
        repBtn.className = 'action-tag';
        repBtn.textContent = p.img ? 'REPLACE' : 'UPLOAD';
        repBtn.onclick = (e) => {
          e.stopPropagation();
          replaceSingle(idx);
        };

        const insBtn = document.createElement('button');
        insBtn.className = 'action-tag';
        insBtn.textContent = '+ INSERT';
        insBtn.onclick = (e) => {
          e.stopPropagation();
          addNewSlot(idx + 1);
        };

        const delBtn = document.createElement('button');
        delBtn.className = 'action-tag';
        delBtn.textContent = '×';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          removeSlot(idx);
        };

        actions.appendChild(repBtn);
        actions.appendChild(insBtn);
        if (projects.length > 1) actions.appendChild(delBtn);
        frame.appendChild(actions);

        if (p.img) {
          frame.appendChild(createMediaElement(p, false));
        } else {
          const empty = document.createElement('div');
          empty.className = 'empty-slot';
          empty.innerHTML = `<span>+ UPLOAD MEDIA</span><span style="font-size:9px;">DROP IMAGE/VIDEO OR CLICK</span>`;
          frame.appendChild(empty);
        }

        const cap = document.createElement('div');
        cap.className = 'caption';
        cap.innerHTML = `
          <span>${p.title}</span>
          <div class="caption-right">
            <button class="insert-inline" onclick="event.stopPropagation(); addNewSlot(${idx + 1})">+ INSERT AFTER</button>
            <span class="num">${numStr}</span>
          </div>
        `;

        item.appendChild(frame);
        item.appendChild(cap);
        grid.appendChild(item);

        // Archive Row
        const row = document.createElement('div');
        row.className = 'archive-row';
        row.innerHTML = `<span>${numStr}</span><span>${p.title}</span><span style="text-align:right; color:var(--muted);">${p.year}</span>`;
        row.onclick = () => openLightbox(idx);
        archive.appendChild(row);
      });
    }

    function addNewSlot(insertIndex) {
      const nextNumber = padNum(projects.length + 1);
      projects.splice(insertIndex, 0, {
        title: `EDITORIAL ${nextNumber}`,
        year: '2026',
        img: null
      });
      saveState();
      renderCover();
      renderGrid();
      replaceSingle(insertIndex);
    }

    function removeSlot(idx) {
      if (projects.length <= 1) return;
      projects.splice(idx, 1);
      saveState();
      renderCover();
      renderGrid();
    }

    function enterWork() {
      showAll();
      document.getElementById('work').scrollIntoView({ behavior: 'smooth' });
    }

    function goCover() {
      showAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showAll() {
      document.getElementById('cover').style.display = 'flex';
      document.getElementById('work').style.display = 'block';
      document.getElementById('archive-view').style.display = 'none';
      document.getElementById('btn-all').classList.add('active');
      document.getElementById('btn-archive').classList.remove('active');
    }

    function showArchive() {
      document.getElementById('cover').style.display = 'none';
      document.getElementById('work').style.display = 'none';
      document.getElementById('archive-view').style.display = 'block';
      document.getElementById('btn-archive').classList.add('active');
      document.getElementById('btn-all').classList.remove('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleInfo(open) {
      document.getElementById('info-modal').classList.toggle('open', open);
    }

    function openLightbox(idx) {
      activeIndex = idx;
      const p = projects[idx];
      document.getElementById('lb-title').textContent = `${padNum(idx + 1)} — ${p.title}`;
      document.getElementById('lb-counter').textContent = `${idx + 1} / ${projects.length}`;
      const main = document.getElementById('lb-main');
      main.innerHTML = '';
      if (p.img) {
        main.appendChild(createMediaElement(p, true));
      } else {
        const empty = document.createElement('div');
        empty.className = 'empty-slot';
        empty.style.width = '60vw';
        empty.textContent = '+ CLICK REPLACE TO UPLOAD';
        main.appendChild(empty);
      }
      document.getElementById('lightbox').classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    function stepLightbox(dir) {
      openLightbox((activeIndex + dir + projects.length) % projects.length);
    }

    function replaceSingle(idx) {
      replaceTargetIndex = idx;
      document.getElementById('single-input').click();
    }

    function triggerBulkUpload() {
      document.getElementById('bulk-input').click();
    }

    function loadMediaFile(file, idx) {
      const isVid = file.type.startsWith('video/');
      if (isVid) {
        projects[idx].img = URL.createObjectURL(file);
        projects[idx].type = 'video';
        renderCover();
        renderGrid();
        if (document.getElementById('lightbox').classList.contains('open')) openLightbox(idx);
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        projects[idx].img = e.target.result;
        projects[idx].type = 'image';
        saveState();
        renderCover();
        renderGrid();
        if (document.getElementById('lightbox').classList.contains('open')) {
          openLightbox(idx);
        }
      };
      reader.readAsDataURL(file);
    }

    document.getElementById('single-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) loadMediaFile(file, replaceTargetIndex);
      e.target.value = '';
    });

    document.getElementById('bulk-input').addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      files.forEach((file, i) => {
        if (i < projects.length) {
          loadMediaFile(file, i);
        } else {
          const newIdx = projects.length;
          projects.push({
            title: `EDITORIAL ${padNum(newIdx + 1)}`,
            year: '2026',
            img: null
          });
          loadMediaFile(file, newIdx);
        }
      });
      e.target.value = '';
    });

    // Cover stage drag & drop
    const coverStage = document.getElementById('cover-stage');
    coverStage.ondragover = (e) => e.preventDefault();
    coverStage.ondrop = (e) => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file && (file.type.startsWith('image/') || file.type.startsWith('video/'))) {
        loadMediaFile(file, currentSlide);
      }
    };

    window.addEventListener('scroll', () => {
      const header = document.getElementById('site-header');
      header.classList.toggle('on-cover', window.scrollY < window.innerHeight * 0.75);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeLightbox();
        toggleInfo(false);
      } else if (document.getElementById('lightbox').classList.contains('open')) {
        if (e.key === 'ArrowRight') stepLightbox(1);
        if (e.key === 'ArrowLeft') stepLightbox(-1);
      }
    });

    renderCover();
    renderGrid();
    restartTimer();
  </script>
</body>
</html>
